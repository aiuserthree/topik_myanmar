<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>관리자 로그인 — TOPIK Myanmar</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--red:#CD2E3A;--navy:#003478;--shadow:0 8px 32px rgba(0,20,60,0.12);--gray-light:#e2e8f0;--gray-text:#64748b;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#0a1628 0%,#0f2744 45%,#132f52 100%);min-height:100vh;color:#1a1a2e;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));}
    .card{width:100%;max-width:420px;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
    .card-top{background:linear-gradient(135deg,var(--navy),#001a40);padding:32px 28px;text-align:center;color:#fff;}
    .badge{display:inline-flex;align-items:center;gap:6px;background:var(--red);font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:14px;}
    .card-top h1{font-size:22px;font-weight:700;margin-bottom:6px;}
    .card-top p{font-size:12px;color:#94a8c4;line-height:1.5;}
    .card-body{padding:28px 26px 30px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px;}
    .input-wrap{position:relative;}
    .input-wrap input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-light);border-radius:10px;font-size:15px;font-family:inherit;transition:border .2s,box-shadow .2s;}
    .input-wrap input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,52,120,0.1);}
    .input-wrap input.has-toggle{padding-right:46px;}
    .pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-text);padding:6px;display:flex;align-items:center;border-radius:6px;}
    .pw-toggle:hover{color:var(--navy);}
    .pw-toggle:focus-visible{outline:2px solid var(--navy);outline-offset:1px;}
    .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--navy);color:#fff;transition:background .2s;margin-top:4px;}
    .btn:hover{background:#002060;}
    .btn:active{transform:scale(0.99);}
    .foot{margin-top:20px;text-align:center;font-size:12px;color:var(--gray-text);}
    .foot a{color:var(--navy);font-weight:600;text-decoration:none;}
    .foot a:hover{color:var(--red);}
  </style>
  <link rel="stylesheet" href="css/mobile.css"/>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-top">
      <div class="badge">ADMIN</div>
      <h1>관리자 로그인</h1>
      <p>관리자 계정으로 로그인하세요.</p>
    </div>
    <div class="card-body">
      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label for="adminUser">관리자 아이디</label>
          <div class="input-wrap">
            <input type="text" id="adminUser" name="username" autocomplete="username" placeholder="admin"/>
          </div>
        </div>
        <div class="form-group">
          <label for="adminPass">비밀번호</label>
          <div class="input-wrap">
            <input type="password" id="adminPass" name="password" autocomplete="current-password" placeholder="비밀번호" class="has-toggle"/>
            <button type="button" class="pw-toggle" id="adminPwToggle" onclick="toggleAdminPw()" aria-label="비밀번호 표시">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div id="adminLoginErr" style="display:none;margin-bottom:14px;padding:11px 14px;background:#fff0f1;border:1px solid #fca5a5;border-radius:10px;font-size:13px;color:var(--red);"></div>
        <button type="submit" class="btn">로그인</button>
      </form>
      <p class="foot" style="margin-top:14px;">데모 계정: <strong>admin / topik2026</strong></p>
      <p class="foot"><a href="index.html">← 사용자 사이트로 돌아가기</a></p>
    </div>
  </div>
</div>
<script src="js/admin-auth.js"></script>
<script>
  var ADMIN_EYE_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ADMIN_EYE_OFF_SVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  function toggleAdminPw(){
    var pw=document.getElementById('adminPass');
    var btn=document.getElementById('adminPwToggle');
    if(!pw||!btn)return;
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    btn.innerHTML=show?ADMIN_EYE_OFF_SVG:ADMIN_EYE_SVG;
    btn.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 표시');
  }
</script>
<script>
(function () {
  function safeNext() {
    var q = new URLSearchParams(window.location.search).get('next');
    return q === 'admin.html' ? q : 'admin.html';
  }
  function showErr(msg){
    var box=document.getElementById('adminLoginErr');
    if(!box)return;
    box.textContent=msg;
    box.style.display=msg?'block':'none';
  }
  function fmtTime(ms){
    var m=Math.ceil(Math.max(0,ms-Date.now())/60000);
    return m+'분';
  }
  document.addEventListener('DOMContentLoaded', function () {
    if (window.AdminAuth && AdminAuth.isSessionValid()) {
      location.replace(safeNext());
      return;
    }
    document.getElementById('adminLoginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      showErr('');
      var user=(document.getElementById('adminUser').value||'').trim();
      var pass=document.getElementById('adminPass').value||'';
      if(!user||!pass){showErr('아이디와 비밀번호를 입력하세요.');return;}
      if(!window.AdminAuth){showErr('인증 모듈을 불러오지 못했습니다.');return;}
      var res=AdminAuth.login(user,pass);
      if(res&&res.ok){
        location.href=safeNext();
        return;
      }
      if(res&&res.locked){
        showErr('로그인 시도가 5회 초과되어 계정이 잠겼습니다. 약 '+fmtTime(res.until)+' 후 다시 시도해 주세요.');
        return;
      }
      var remain=(res&&typeof res.remain==='number')?res.remain:null;
      showErr('아이디 또는 비밀번호가 올바르지 않습니다.'+(remain!=null?' (남은 시도 '+remain+'회)':''));
    });
  });
})();
</script>
</body>
</html>
