<script>let FAQS=[ {id:1,cat:'접수',qKo:'접수 기간은 언제인가요?',qMy:'',aKo:'제106회 TOPIK 접수 기간은 2025년 7월 1일부터 7월 20일까지입니다.',aMy:'',lang:'전체',vis:1,order:1}, {id:2,cat:'접수',qKo:'사진 규격은 어떻게 되나요?',qMy:'',aKo:'반명함판(3×4cm), 최근 6개월 이내 촬영, 무배경 컬러 사진이어야 합니다.',aMy:'',lang:'전체',vis:1,order:2}, {id:3,cat:'시험',qKo:'수험표는 필수로 지참해야 하나요?',qMy:'',aKo:'네, 수험표와 유효한 신분증을 반드시 지참해야 합니다.',aMy:'',lang:'전체',vis:1,order:1}, {id:4,cat:'성적',qKo:'성적 발표는 언제인가요?',qMy:'',aKo:'시험일로부터 약 2개월 후 한국어능력시험 공식 홈페이지에서 확인 가능합니다.',aMy:'',lang:'전체',vis:1,order:1}, {id:5,cat:'기타',qKo:'미얀마 거주 외국인도 응시 가능한가요?',qMy:'',aKo:'미얀마에 거주하는 외국인도 응시 가능합니다.',aMy:'',lang:'전체',vis:0,order:1},];let editFaqId=null;
function renderFaqs(){ const cat=document.getElementById('faqCat').value; const q=document.getElementById('faqSearch').value.trim().toLowerCase(); const list=FAQS.filter(f=>{ if(cat&&f.cat!==cat)return false; if(q&&!f.qKo.toLowerCase().includes(q))return false; return true; }).sort((a,b)=>a.order-b.order); const container=document.getElementById('faqList'); if(!list.length){container.innerHTML=`<div style="text-align:center;padding:32px;color:var(--gray-400)">등록된 FAQ가 없습니다.</div>`;return;} container.innerHTML=list.map(f=>` <div class="faq-row"> <span class="drag-handle" title="순서 변경">⠿</span> <div class="faq-qna" style="flex:1"> <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"> <span class="chip chip-blue" style="font-size:.65rem">${f.cat}</span> ${f.vis?'':'<span class="chip chip-gray" style="font-size:.65rem">숨김</span>'} <span style="font-size:.7rem;color:var(--gray-400)">순서: ${f.order}</span> </div> <div class="faq-q">Q. ${f.qKo}</div> <div class="faq-a">A. ${f.aKo}</div> </div> <div style="display:flex;gap:4px;flex-shrink:0"> <button class="btn btn-outline btn-xs" onclick="openFaqModal(${f.id})">수정</button> <button class="btn btn-danger btn-xs" onclick="deleteFaq(${f.id})">삭제</button> </div> </div> `).join('');}
function openFaqModal(id){ editFaqId=id; const f=id?FAQS.find(x=>x.id===id):null; document.getElementById('fm-title').textContent=f?'FAQ 수정':'FAQ 등록'; document.getElementById('fm-cat').value=f?f.cat:'접수'; document.getElementById('fm-lang').value=f?f.lang:'전체'; document.getElementById('fm-vis').value=f?f.vis:1; document.getElementById('fm-q-ko').value=f?f.qKo:''; document.getElementById('fm-q-my').value=f?f.qMy:''; document.getElementById('fm-a-ko').value=f?f.aKo:''; document.getElementById('fm-a-my').value=f?f.aMy:''; document.getElementById('fm-order').value=f?f.order:''; openModal('faqModal');}function saveFaq(){ const qKo=document.getElementById('fm-q-ko').value.trim(); const aKo=document.getElementById('fm-a-ko').value.trim(); if(!qKo||!aKo){alert('질문과 답변(한국어)을 입력해 주세요.');return;} const data={cat:document.getElementById('fm-cat').value,qKo,qMy:document.getElementById('fm-q-my').value.trim(),aKo,aMy:document.getElementById('fm-a-my').value.trim(),lang:document.getElementById('fm-lang').value,vis:+document.getElementById('fm-vis').value,order:+document.getElementById('fm-order').value||99}; if(editFaqId){const idx=FAQS.findIndex(f=>f.id===editFaqId);FAQS[idx]={...FAQS[idx],...data};} else{FAQS.push({id:Date.now(),...data});} closeModal('faqModal');renderFaqs();}function deleteFaq(id){if(!confirm('삭제하시겠습니까?'))return;FAQS=FAQS.filter(f=>f.id!==id);renderFaqs();}['faqCat'].forEach(id=>document.getElementById(id).addEventListener('change',renderFaqs));document.getElementById('faqSearch').addEventListener('input',renderFaqs);function openModal(id){document.getElementById(id).classList.add('open');}function closeModal(id){document.getElementById(id).classList.remove('open');}document.querySelectorAll('.overlay').forEach(ov=>{ov.addEventListener('click',function(e){if(e.target===this)closeModal(this.id);});});function doLogout(){sessionStorage.clear();location.href='admin-login.html';}(function(){ const admin=JSON.parse(sessionStorage.getItem('bo_admin')||'{"name":"관리자","role":"최고관리자"}'); const ini=(admin.name||'관')[0]; ['sb-av','tb-av'].forEach(id=>document.getElementById(id).textContent=ini); document.getElementById('sb-name').textContent=admin.name;document.getElementById('sb-role').textContent=admin.role; document.getElementById('tb-name').textContent=admin.name;document.getElementById('tb-role').textContent=admin.role; const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('backdrop'); document.getElementById('hbBtn').addEventListener('click',()=>{const o=sidebar.classList.toggle('open');backdrop.classList.toggle('show',o);}); backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('show');}); document.getElementById('logoutBtn').addEventListener('click',()=>openModal('logoutModal')); renderFaqs();})();</script></body></html>
