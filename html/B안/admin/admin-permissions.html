<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>권한 관리 – TOPIK Admin</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR',sans-serif;background:#f4f6f9;color:#222;display:flex;min-height:100vh}.sidebar{width:220px;min-height:100vh;background:#1a2236;display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid #2d3a52}.sidebar-logo span{color:#fff;font-size:17px;font-weight:700}.sidebar-logo small{display:block;color:#7a8baa;font-size:11px;margin-top:3px}.nav-group{padding:18px 0 6px}.nav-label{color:#4e6080;font-size:10px;font-weight:700;letter-spacing:1px;padding:0 20px 8px;text-transform:uppercase}.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:#a0aec0;font-size:13.5px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}.nav-item:hover{background:#243050;color:#fff}.nav-item.active{background:#2563eb;color:#fff}.nav-icon{width:18px;text-align:center;font-size:15px}.sidebar-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #2d3a52}.logout-btn{width:100%;background:none;border:1px solid #2d3a52;color:#7a8baa;padding:9px;border-radius:6px;font-size:13px;cursor:pointer;transition:all .15s}.logout-btn:hover{border-color:#ef4444;color:#ef4444}.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}.topbar{background:#fff;border-bottom:1px solid #e5e9f0;padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}.topbar-title{font-size:16px;font-weight:700;color:#1a2236}.topbar-right{display:flex;align-items:center;gap:12px}.admin-badge{background:#f0f4ff;color:#2563eb;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}.content{padding:28px 32px;flex:1}.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}.page-header h1{font-size:20px;font-weight:700;color:#1a2236}.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s}.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4fd8}.btn-secondary{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-secondary:hover{background:#f9fafb}.btn-sm{padding:6px 12px;font-size:12.5px}
/* 역할 탭 */.role-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}.role-tab{padding:8px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;border:2px solid #e5e9f0;background:#fff;color:#6b7280;transition:all .15s}.role-tab.active{border-color:#2563eb;background:#eff6ff;color:#2563eb}
/* 권한 매트릭스 카드 */.card{background:#fff;border:1px solid #e5e9f0;border-radius:10px;overflow:hidden;margin-bottom:20px}.card-header{padding:16px 20px;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between}.card-header h2{font-size:15px;font-weight:700;color:#1a2236}.perm-table{width:100%;border-collapse:collapse;font-size:13.5px}.perm-table th{background:#f8fafc;color:#6b7280;font-weight:600;font-size:12px;padding:12px 16px;border-bottom:1px solid #e5e9f0;text-align:left}.perm-table th:not(:first-child){text-align:center}.perm-table td{padding:12px 16px;border-bottom:1px solid #f1f5f9;color:#374151;vertical-align:middle}.perm-table tr:last-child td{border-bottom:none}.perm-table td:not(:first-child){text-align:center}.perm-group{font-size:11.5px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;background:#fafafa;padding:10px 16px;border-bottom:1px solid #f1f5f9}
/* 토글 체크박스 */.toggle{position:relative;display:inline-block;width:38px;height:22px}.toggle input{opacity:0;width:0;height:0}.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#d1d5db;border-radius:22px;transition:.2s}.toggle-slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.toggle-slider{background:#2563eb}.toggle input:checked+.toggle-slider:before{transform:translateX(16px)}.toggle input:disabled+.toggle-slider{opacity:.5;cursor:not-allowed}
/* 역할 설명 */.role-desc-card{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px 20px;margin-bottom:20px;font-size:13.5px;color:#1d4ed8}.role-desc-card strong{font-weight:700}
/* 모달 */.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:12px;width:400px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between}.modal-header h2{font-size:16px;font-weight:700;color:#1a2236}.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#9ca3af;line-height:1}.modal-body{padding:24px;text-align:center}.modal-footer{padding:16px 24px;border-top:1px solid #e5e9f0;display:flex;justify-content:center;gap:12px}
@media(max-width:768px){ .sidebar{transform:translateX(-220px);transition:transform .25s} .sidebar.open{transform:translateX(0)} .main{margin-left:0} .content{padding:20px 16px} .topbar{padding:0 16px} .perm-table{font-size:12px}}</style></head><body>
<aside class="sidebar" id="sidebar"> <div class="sidebar-logo"> <span>TOPIK Admin</span> <small>한국어능력시험 관리시스템</small> </div> <nav> <div class="nav-group"> <div class="nav-label">대시보드</div> <a href="admin-dashboard.html" class="nav-item"><span class="nav-icon">▦</span>개요</a> </div> <div class="nav-group"> <div class="nav-label">접수 관리</div> <a href="admin-applicants.html" class="nav-item"><span class="nav-icon">◎</span>접수자 목록</a> </div> <div class="nav-group"> <div class="nav-label">시험 관리</div> <a href="admin-exam-rounds.html" class="nav-item"><span class="nav-icon">◈</span>회차 관리</a> <a href="admin-exam-venues.html" class="nav-item"><span class="nav-icon">◉</span>시험장 관리</a> </div> <div class="nav-group"> <div class="nav-label">게시판 관리</div> <a href="admin-notice.html" class="nav-item"><span class="nav-icon">◆</span>공지사항</a> <a href="admin-faq.html" class="nav-item"><span class="nav-icon">◇</span>FAQ</a> <a href="admin-refund.html" class="nav-item"><span class="nav-icon">◀</span>환불·정정</a> <a href="admin-inquiry.html" class="nav-item"><span class="nav-icon">▷</span>1:1 문의</a> </div> <div class="nav-group"> <div class="nav-label">회원·약관</div> <a href="admin-members.html" class="nav-item"><span class="nav-icon">◐</span>회원 관리</a> <a href="admin-terms.html" class="nav-item"><span class="nav-icon">▣</span>약관 관리</a> </div> <div class="nav-group"> <div class="nav-label">시스템</div> <a href="admin-accounts.html" class="nav-item"><span class="nav-icon">▤</span>계정 관리</a> <a href="admin-permissions.html" class="nav-item active"><span class="nav-icon">▥</span>권한 관리</a> <a href="admin-history.html" class="nav-item"><span class="nav-icon">▧</span>처리 이력</a> </div> </nav> <div class="sidebar-bottom"> <button class="logout-btn" onclick="openModal('logoutModal')">로그아웃</button> </div></aside>
<div class="main"> <header class="topbar"> <div style="display:flex;align-items:center;gap:12px"> <button onclick="toggleSidebar()" style="display:none;background:none;border:none;font-size:20px;cursor:pointer" id="menu-btn">☰</button> <span class="topbar-title">권한 관리</span> </div> <div class="topbar-right"> <span class="admin-badge">관리자</span> <span style="font-size:13px;color:#6b7280">admin@topik.go.kr</span> </div> </header>
 <div class="content"> <div class="page-header"> <h1>권한 관리</h1> <button class="btn btn-primary" onclick="savePerms()">변경 사항 저장</button> </div>
 <!-- 역할 탭 --> <div class="role-tabs"> <button class="role-tab active" onclick="selectRole('슈퍼관리자',this)">슈퍼관리자</button> <button class="role-tab" onclick="selectRole('관리자',this)">관리자</button> <button class="role-tab" onclick="selectRole('운영자',this)">운영자</button> <button class="role-tab" onclick="selectRole('조회자',this)">조회자</button> </div>
 <!-- 역할 설명 --> <div class="role-desc-card" id="roleDesc"></div>
 <!-- 권한 매트릭스 --> <div class="card"> <div class="card-header"> <h2 id="permTitle">슈퍼관리자 권한 설정</h2> <span style="font-size:12.5px;color:#9ca3af">토글로 개별 권한을 설정합니다</span> </div> <div class="table-wrap" style="overflow-x:auto"> <table class="perm-table" id="permTable"></table> </div> </div> </div></div>
<!-- 저장 완료 모달 --><div class="modal-overlay" id="saveModal"> <div class="modal"> <div class="modal-header"> <h2>저장 완료</h2> <button class="modal-close" onclick="closeModal('saveModal')">×</button> </div> <div class="modal-body"> <div style="font-size:36px">✅</div> <p style="margin-top:12px;color:#374151">권한 설정이 저장되었습니다.</p> </div> <div class="modal-footer"> <button class="btn btn-primary" onclick="closeModal('saveModal')">확인</button> </div> </div></div>
<!-- 로그아웃 --><div class="modal-overlay" id="logoutModal"> <div class="modal" style="width:380px"> <div class="modal-header"> <h2>로그아웃</h2> <button class="modal-close" onclick="closeModal('logoutModal')">×</button> </div> <div class="modal-body"> <div style="font-size:32px">🔓</div> <p style="margin-top:8px;color:#374151">정말 로그아웃 하시겠습니까?</p> </div> <div class="modal-footer"> <button class="btn btn-secondary" onclick="closeModal('logoutModal')">취소</button> <button class="btn btn-danger" onclick="location.href='admin-login.html'">로그아웃</button> </div> </div></div>
<script>const ROLE_DESC={ '슈퍼관리자':'시스템 전체 관리 권한을 보유합니다. 모든 기능에 대한 조회·생성·수정·삭제가 가능하며, 계정 및 권한 관리도 포함됩니다.', '관리자':'대부분의 관리 기능을 수행할 수 있으나, 계정·권한 관리 등 시스템 핵심 설정은 제한됩니다.', '운영자':'접수, 시험, 게시판 등 운영 관련 기능에 대한 조회·처리 권한이 있습니다. 시스템 설정 변경은 불가합니다.', '조회자':'모든 항목에 대한 조회(읽기) 권한만 보유합니다. 데이터 수정·삭제·생성은 불가합니다.',};
const SECTIONS=[ { group:'접수 관리', items:[ {key:'applicants_read',label:'접수자 목록 조회'}, {key:'applicants_edit',label:'접수 정보 수정'}, {key:'applicants_export',label:'엑셀 내보내기'}, ] }, { group:'시험 관리', items:[ {key:'exam_rounds_read',label:'회차 목록 조회'}, {key:'exam_rounds_edit',label:'회차 생성·수정·삭제'}, {key:'exam_venues_read',label:'시험장 조회'}, {key:'exam_venues_edit',label:'시험장 생성·수정·삭제'}, ] }, { group:'게시판 관리', items:[ {key:'board_read',label:'게시물 조회'}, {key:'board_edit',label:'게시물 생성·수정·삭제'}, {key:'inquiry_reply',label:'1:1 문의 답변'}, {key:'refund_process',label:'환불·정정 처리'}, ] }, { group:'회원·약관', items:[ {key:'members_read',label:'회원 목록 조회'}, {key:'members_block',label:'회원 정지·해제'}, {key:'terms_read',label:'약관 조회'}, {key:'terms_edit',label:'약관 생성·수정·삭제'}, ] }, { group:'시스템', items:[ {key:'accounts_read',label:'계정 조회'}, {key:'accounts_edit',label:'계정 생성·수정·삭제'}, {key:'permissions_edit',label:'권한 설정 변경'}, {key:'history_read',label:'처리 이력 조회'}, ] },];
// 역할별 기본 권한const PERMS={ '슈퍼관리자':{applicants_read:true,applicants_edit:true,applicants_export:true,exam_rounds_read:true,exam_rounds_edit:true,exam_venues_read:true,exam_venues_edit:true,board_read:true,board_edit:true,inquiry_reply:true,refund_process:true,members_read:true,members_block:true,terms_read:true,terms_edit:true,accounts_read:true,accounts_edit:true,permissions_edit:true,history_read:true}, '관리자':{applicants_read:true,applicants_edit:true,applicants_export:true,exam_rounds_read:true,exam_rounds_edit:true,exam_venues_read:true,exam_venues_edit:true,board_read:true,board_edit:true,inquiry_reply:true,refund_process:true,members_read:true,members_block:true,terms_read:true,terms_edit:false,accounts_read:true,accounts_edit:false,permissions_edit:false,history_read:true}, '운영자':{applicants_read:true,applicants_edit:false,applicants_export:true,exam_rounds_read:true,exam_rounds_edit:false,exam_venues_read:true,exam_venues_edit:false,board_read:true,board_edit:true,inquiry_reply:true,refund_process:true,members_read:true,members_block:false,terms_read:true,terms_edit:false,accounts_read:false,accounts_edit:false,permissions_edit:false,history_read:true}, '조회자':{applicants_read:true,applicants_edit:false,applicants_export:false,exam_rounds_read:true,exam_rounds_edit:false,exam_venues_read:true,exam_venues_edit:false,board_read:true,board_edit:false,inquiry_reply:false,refund_process:false,members_read:true,members_block:false,terms_read:true,terms_edit:false,accounts_read:false,accounts_edit:false,permissions_edit:false,history_read:true},};
let currentRole='슈퍼관리자';
function selectRole(role, btn){ currentRole=role; document.querySelectorAll('.role-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderPerms();}
function renderPerms(){ document.getElementById('permTitle').textContent=`${currentRole} 권한 설정`; document.getElementById('roleDesc').innerHTML=`<strong>${currentRole}</strong> — ${ROLE_DESC[currentRole]}`; const isSuperAdmin=currentRole==='슈퍼관리자'; const perms=PERMS[currentRole]; const table=document.getElementById('permTable'); let html='<thead><tr><th>기능</th><th>허용 여부</th></tr></thead><tbody>'; SECTIONS.forEach(sec=>{ html+=`<tr><td colspan="2" class="perm-group">${sec.group}</td></tr>`; sec.items.forEach(item=>{ const checked=perms[item.key]?'checked':''; const disabled=isSuperAdmin?'disabled':''; html+=` <tr> <td>${item.label}</td> <td> <label class="toggle"> <input type="checkbox" data-key="${item.key}" ${checked} ${disabled} onchange="togglePerm('${item.key}',this.checked)"/> <span class="toggle-slider"></span> </label> </td> </tr> `; }); }); html+='</tbody>'; table.innerHTML=html;}
function togglePerm(key,val){ PERMS[currentRole][key]=val;}
function savePerms(){ openModal('saveModal');}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}document.querySelectorAll('.modal-overlay').forEach(el=>{ el.addEventListener('click',e=>{if(e.target===el) el.classList.remove('open')});});function checkMobile(){ const btn=document.getElementById('menu-btn'); if(window.innerWidth<=768) btn.style.display='block'; else{btn.style.display='none';document.getElementById('sidebar').classList.remove('open');}}window.addEventListener('resize',checkMobile);checkMobile();renderPerms();</script></body></html>
