*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1a4fa0;--primary-dark:#133d80;--primary-light:#e8f0fb;--danger:#d9363e;--danger-light:#fdf0f0;--success:#1e7e4a;--success-light:#eaf6ef;--warning:#b45309;--warning-light:#fef9ec;--info:#0e6fa8;--info-light:#e6f4fb;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;--gray-800:#1e293b;--gray-900:#0f172a;--white:#fff;--radius-sm:4px;--radius:8px;--radius-lg:12px;--shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-lg:0 8px 28px rgba(0,0,0,.15);--font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--sidebar-w:240px;--topbar-h:56px;--tr:.18s ease}
html{font-size:15px}body{font-family:var(--font);color:var(--gray-800);background:var(--gray-50);line-height:1.6;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}input,select,textarea{font-family:inherit;font-size:inherit}
/* ── 공통 사이드바 ── */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--gray-900);color:var(--gray-400);display:flex;flex-direction:column;z-index:200;overflow:hidden;transition:transform .22s ease}.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 18px;height:var(--topbar-h);border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}.sb-icon{width:32px;height:32px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.sb-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2}.sb-brand-text{font-size:.82rem;font-weight:700;color:#fff;line-height:1.3}.sb-brand-sub{font-size:.7rem;color:var(--gray-400)}.sb-nav{flex:1;padding:12px 0 8px;overflow-y:auto;min-height:0;scrollbar-width:none;-ms-overflow-style:none}.sb-section{padding:16px 18px 4px;font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gray-500)}.sb-link{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:.875rem;font-weight:500;color:var(--gray-400);border-left:3px solid transparent;transition:var(--tr)}.sb-link:hover{background:rgba(255,255,255,.06);color:#fff}.sb-link.active{background:rgba(26,79,160,.28);border-left-color:var(--primary);color:#fff}.sb-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0;opacity:.8}.sb-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:.65rem;font-weight:700;border-radius:10px;padding:1px 6px;line-height:1.7}.sb-footer{padding:12px 18px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}.sb-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;flex-shrink:0}.sb-user-name{font-size:.82rem;font-weight:600;color:#fff}.sb-user-role{font-size:.7rem;color:var(--gray-400)}.sb-logout{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border-radius:var(--radius-sm);font-size:.82rem;color:var(--gray-400);transition:var(--tr)}.sb-logout:hover{background:rgba(217,54,62,.15);color:#f87171}.sb-logout svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

.pagination{display:flex;align-items:center;justify-content:center;gap:4px;padding:18px}.page-btn{width:34px;height:34px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}.page-btn:hover,.page-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:center;justify-content:center}.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:12px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between}.modal-header h2{font-size:16px;font-weight:700;color:#1a2236}.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#9ca3af;line-height:1}.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-top:1px solid #e5e9f0;display:flex;justify-content:flex-end}

<script>const HISTORY=[ {id:1,at:'2025-04-21 09:15:32',admin:'김관리',module:'접수',action:'수정',desc:'접수 정보 수정',target:'Mg Aung Kyaw (ID:1)',ip:'192.168.1.10',diff:'- 시험 레벨: TOPIK I\n+ 시험 레벨: TOPIK II'}, {id:2,at:'2025-04-21 09:12:05',admin:'김관리',module:'시스템',action:'로그인',desc:'관리자 로그인',target:'-',ip:'192.168.1.10',diff:''}, {id:3,at:'2025-04-20 16:40:11',admin:'이운영',module:'게시판',action:'생성',desc:'공지사항 등록',target:'제105회 TOPIK 합격자 발표',ip:'192.168.1.22',diff:'+ 제목: 제105회 TOPIK 합격자 발표\n+ 내용: 2025년 4월 20일 합격자가 발표되었습니다.'}, {id:4,at:'2025-04-20 14:30:55',admin:'이운영',module:'게시판',action:'처리',desc:'환불 신청 처리',target:'환불신청 #REF-2025-041 (Thin Zar Win)',ip:'192.168.1.22',diff:'- 상태: 대기\n+ 상태: 승인\n+ 처리 메모: 본인 사정으로 인한 취소 확인'}, {id:5,at:'2025-04-20 13:10:00',admin:'박담당',module:'회원',action:'수정',desc:'회원 이용 정지',target:'Kyaw Zin Htut (ID:3)',ip:'10.0.0.5',diff:'- 상태: 활성\n+ 상태: 정지'}, {id:6,at:'2025-04-20 11:05:22',admin:'박담당',module:'시스템',action:'로그인',desc:'관리자 로그인',target:'-',ip:'10.0.0.5',diff:''}, {id:7,at:'2025-04-19 17:25:44',admin:'한관리',module:'시험',action:'생성',desc:'시험 회차 생성',target:'제106회 TOPIK',ip:'192.168.1.30',diff:'+ 회차: 제106회\n+ 시험일: 2025-09-21\n+ 접수기간: 2025-07-01 ~ 2025-07-31'}, {id:8,at:'2025-04-19 15:00:10',admin:'김관리',module:'약관',action:'수정',desc:'이용약관 버전 업데이트',target:'TOPIK 접수 및 이용약관 v3.1',ip:'192.168.1.10',diff:'- 버전: v3.0\n+ 버전: v3.1\n+ 시행일: 2025-03-01\n+ 변경사유: 개인정보보호법 개정 반영'}, {id:9,at:'2025-04-19 11:30:00',admin:'이운영',module:'접수',action:'내보내기',desc:'접수자 목록 엑셀 내보내기',target:'제105회 TOPIK 전체 (8명)',ip:'192.168.1.22',diff:''}, {id:10,at:'2025-04-18 16:45:20',admin:'박담당',module:'게시판',action:'생성',desc:'FAQ 등록',target:'접수 수수료 환불 정책은 어떻게 되나요?',ip:'10.0.0.5',diff:'+ 카테고리: 환불·정정\n+ 질문 추가'}, {id:11,at:'2025-04-18 14:00:00',admin:'한관리',module:'시험',action:'수정',desc:'시험장 정원 수정',target:'양곤 대학교 시험장',ip:'192.168.1.30',diff:'- 정원: 200명\n+ 정원: 250명'}, {id:12,at:'2025-04-17 10:20:33',admin:'김관리',module:'계정',action:'생성',desc:'운영자 계정 추가',target:'정운영 (jung@topik.go.kr)',ip:'192.168.1.10',diff:'+ 이름: 정운영\n+ 이메일: jung@topik.go.kr\n+ 역할: 운영자'}, {id:13,at:'2025-04-16 09:00:00',admin:'김관리',module:'시스템',action:'수정',desc:'권한 설정 변경',target:'운영자 역할',ip:'192.168.1.10',diff:'- board_edit: false\n+ board_edit: true\n- inquiry_reply: false\n+ inquiry_reply: true'}, {id:14,at:'2025-04-15 15:55:10',admin:'이운영',module:'게시판',action:'삭제',desc:'공지사항 삭제',target:'[임시] 서버 점검 안내',ip:'192.168.1.22',diff:'- 제목: [임시] 서버 점검 안내 (삭제됨)'}, {id:15,at:'2025-04-14 13:30:00',admin:'박담당',module:'게시판',action:'처리',desc:'1:1 문의 답변 완료',target:'문의 #INQ-2025-039 (Mg Aung Kyaw)',ip:'10.0.0.5',diff:'- 상태: 대기\n+ 상태: 답변완료'},];
let currentPage=1;const PAGE_SIZE=10;
function actionChip(a){ const m={ '생성':'chip-create','수정':'chip-update','삭제':'chip-delete', '로그인':'chip-login','처리':'chip-process','내보내기':'chip-export', }; return `<span class="chip ${m[a]||''}">${a}</span>`;}
function filtered(){ const action=document.getElementById('filterAction').value; const module=document.getElementById('filterModule').value; const admin=document.getElementById('filterAdmin').value; const target=document.getElementById('filterTarget').value.trim().toLowerCase(); const from=document.getElementById('filterDateFrom').value; const to=document.getElementById('filterDateTo').value; return HISTORY.filter(h=>{ if(action && h.action!==action) return false; if(module && h.module!==module) return false; if(admin && h.admin!==admin) return false; if(target && !((h.target||'').toLowerCase().includes(target) || (h.desc||'').toLowerCase().includes(target))) return false; const hDate=h.at.slice(0,10); if(from && hDate<from) return false; if(to && hDate>to) return false; return true; });}
function quickRange(days){ const maxStr=HISTORY.reduce((m,h)=>{const d=h.at.slice(0,10);return d>m?d:m;},'0000-00-00'); const to=new Date(maxStr+'T00:00:00'); const from=new Date(to); from.setDate(to.getDate()-days+1); const fmt=d=>d.toISOString().slice(0,10); document.getElementById('filterDateFrom').value=fmt(from); document.getElementById('filterDateTo').value=fmt(to); currentPage=1; render();}
function clearRange(){ document.getElementById('filterDateFrom').value=''; document.getElementById('filterDateTo').value=''; currentPage=1; render();}
function render(){ const data=filtered(); document.getElementById('totalCount').textContent=data.length; const start=(currentPage-1)*PAGE_SIZE; const page=data.slice(start,start+PAGE_SIZE); const tbody=document.getElementById('tbody'); if(!page.length){ tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;color:#9ca3af">조회된 이력이 없습니다.</td></tr>'; } else { tbody.innerHTML=page.map((h,i)=>` <tr> <td style="color:#9ca3af">${start+i+1}</td> <td style="font-size:12.5px;color:#6b7280;white-space:nowrap">${h.at}</td> <td style="font-weight:600;color:#1a2236">${h.admin}</td> <td><span style="font-size:12px;background:#f0f4ff;color:#2563eb;padding:2px 8px;border-radius:4px;font-weight:600">${h.module}</span></td> <td>${actionChip(h.action)}</td> <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.desc}</td> <td style="color:#6b7280;font-size:12.5px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.target}</td> <td style="color:#9ca3af;font-size:12px">${h.ip}</td> <td><button class="btn btn-secondary btn-sm" onclick="openDetail(${h.id})">상세</button></td> </tr> `).join(''); } renderPagination(data.length);}
function renderPagination(total){ const pages=Math.ceil(total/PAGE_SIZE)||1; const el=document.getElementById('pagination'); let html=''; html+=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`; for(let i=1;i<=pages;i++) html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`; html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`; el.innerHTML=html;}function goPage(p){ const pages=Math.ceil(filtered().length/PAGE_SIZE)||1; if(p<1||p>pages) return; currentPage=p;render();}
function openDetail(id){ const h=HISTORY.find(x=>x.id===id); if(!h) return; document.getElementById('dd_at').textContent=h.at; document.getElementById('dd_admin').textContent=h.admin; document.getElementById('dd_module').textContent=h.module; document.getElementById('dd_action').innerHTML=actionChip(h.action); document.getElementById('dd_target').textContent=h.target; document.getElementById('dd_ip').textContent=h.ip; document.getElementById('dd_desc').textContent=h.desc; const diffWrap=document.getElementById('dd_diffWrap'); const diffEl=document.getElementById('dd_diff'); if(h.diff){ diffWrap.style.display=''; diffEl.innerHTML=h.diff.split('\n').map(line=>{ if(line.startsWith('+')) return `<span class="diff-add">${line}</span>`; if(line.startsWith('-')) return `<span class="diff-del">${line}</span>`; return line; }).join('\n'); } else { diffWrap.style.display='none'; } openModal('detailModal');}
function exportExcel(){ const data=filtered(); const rows=[['번호','일시','관리자','모듈','유형','내용','대상','IP']]; data.forEach((h,i)=>rows.push([i+1,h.at,h.admin,h.module,h.action,h.desc,h.target,h.ip])); const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='처리이력_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-overlay').forEach(el=>{ el.addEventListener('click',e=>{if(e.target===el) el.classList.remove('open')});});
(function(){ const admin=JSON.parse(sessionStorage.getItem('bo_admin')||'{"name":"관리자","role":"최고관리자"}'); const ini=(admin.name||'관')[0]; ['sb-av','tb-av'].forEach(id=>document.getElementById(id).textContent=ini); document.getElementById('sb-name').textContent=admin.name;document.getElementById('sb-role').textContent=admin.role; document.getElementById('tb-name').textContent=admin.name;document.getElementById('tb-role').textContent=admin.role; const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('backdrop'); document.getElementById('hbBtn').addEventListener('click',()=>{const o=sidebar.classList.toggle('open');backdrop.classList.toggle('show',o);}); backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('show');}); document.getElementById('logoutBtn').addEventListener('click',()=>openModal('logoutModal')); })();
render();</script></body></html>
