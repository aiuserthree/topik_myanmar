<script>let INQUIRIES=[ {id:7,cat:'접수',title:'사진 규격 기준이 어떻게 되나요?',author:'아웅 민',contact:'09-1234-5678',date:'2025.07.10',priv:false,content:'사진 파일 규격이 어떻게 되는지 자세히 알고 싶습니다. 크기, 형식, 배경색 등 안내 부탁드립니다.',reply:'',status:'대기'}, {id:6,cat:'시험',title:'수험표 지참 필수인가요?',author:'수 수 라',contact:'09-9876-0000',date:'2025.07.09',priv:false,content:'시험 당일 수험표가 반드시 필요한지 궁금합니다. 출력본만 가능한지 핸드폰 화면도 되는지 알려주세요.',reply:'',status:'대기'}, {id:5,cat:'기타',title:'미얀마 비거주자도 신청 가능한가요?',author:'떼인 쪼',contact:'09-5555-9999',date:'2025.07.08',priv:false,content:'현재 해외에 거주 중인데 미얀마 시험장에서 응시 신청이 가능한지 문의드립니다.',reply:'',status:'대기'}, {id:4,cat:'접수',title:'접수 취소 후 재접수 가능한가요?',author:'밍 밍 쪼',contact:'09-2222-3333',date:'2025.07.07',priv:true,content:'접수를 취소한 후 같은 회차에 재접수가 가능한지 알고 싶습니다.',reply:'',status:'대기'}, {id:3,cat:'성적',title:'성적 발표 후 성적표 수령 방법은?',author:'나웅 린',contact:'09-4444-5555',date:'2025.07.05',priv:false,content:'성적 발표 이후 성적표를 어떻게 받을 수 있는지 안내해 주세요.',reply:'성적 발표 후 공식 홈페이지에서 출력하시거나 대사관 방문 수령이 가능합니다.',status:'답변완료'}, {id:2,cat:'시험',title:'시험장 변경이 가능한가요?',author:'에이 떼인',contact:'09-6666-7777',date:'2025.07.03',priv:false,content:'접수 후 시험장을 변경할 수 있는지 문의드립니다.',reply:'접수 기간 내에는 마이페이지에서 시험장 변경이 가능합니다. 접수 마감 후에는 변경이 불가합니다.',status:'답변완료'}, {id:1,cat:'접수',title:'동시응시 신청 방법을 알고 싶습니다',author:'쪼 쪼',contact:'09-8888-9999',date:'2025.07.01',priv:false,content:'TOPIK Ⅰ, Ⅱ 동시응시를 하려면 어떻게 접수하면 되나요?',reply:'접수 시 급수 선택 화면에서 "동시응시"를 선택하시면 됩니다.',status:'답변완료'},];let currentIqId=null;let iqStatus='all';
(function(){ var s=INQUIRIES.find(i=>i.id===7); if(s) s.comments=[{id:1,author:'admin',text:'사진 규정 안내 링크 첨부해 답변 예정.',time:'2025.07.10 09:40',replies:[{author:'manager',text:'rules-id 페이지 링크 사용하세요.',time:'2025.07.10 09:55'}]}]; })();
function iqNowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function renderIqStatus(i){ document.getElementById('iq-status-chip').innerHTML=statusChip(i.status); document.getElementById('iq-status-toggle').textContent = i.status==='답변완료' ? '답변대기로 변경' : '답변완료로 표시'; }
function toggleIqStatus(){ const i=INQUIRIES.find(x=>x.id===currentIqId); if(!i)return; i.status = i.status==='답변완료' ? '대기' : '답변완료'; renderIqStatus(i); renderInquiries(); }
function renderIqComments(i){ const box=document.getElementById('iq-comment-list'); const list=i.comments||[]; if(!list.length){ box.innerHTML='<div style="font-size:.8rem;color:var(--gray-400);padding:6px 0">등록된 댓글이 없습니다.</div>'; return; } box.innerHTML=list.map(c=>{ const replies=(c.replies||[]).map(rp=>`<div class="cmt-reply"><div class="cmt-meta">↳ ${rp.author} · ${rp.time}</div><div class="cmt-text">${rp.text}</div></div>`).join(''); return `<div class="cmt"><div class="cmt-meta">${c.author} · ${c.time}</div><div class="cmt-text">${c.text}</div>${replies}<div class="cmt-actions"><button class="btn btn-outline btn-xs" onclick="toggleIqReply(${c.id})">답글</button></div><div class="cmt-reply-box" id="iq-reply-box-${c.id}" style="display:none"><textarea class="form-control" id="iq-reply-input-${c.id}" rows="2" placeholder="대댓글 입력"></textarea><div style="margin-top:6px;text-align:right"><button class="btn btn-primary btn-xs" onclick="iqAddReply(${c.id})">대댓글 등록</button></div></div></div>`; }).join(''); }
function toggleIqReply(cid){ const b=document.getElementById('iq-reply-box-'+cid); if(b) b.style.display=b.style.display==='none'?'block':'none'; }
function iqAddComment(){ const i=INQUIRIES.find(x=>x.id===currentIqId); if(!i)return; const inp=document.getElementById('iq-comment-input'); const txt=inp.value.trim(); if(!txt){alert('댓글 내용을 입력해 주세요.');return;} if(!i.comments)i.comments=[]; i.comments.push({id:Date.now(),author:'관리자',text:txt,time:iqNowStr(),replies:[]}); inp.value=''; renderIqComments(i); }
function iqAddReply(cid){ const i=INQUIRIES.find(x=>x.id===currentIqId); if(!i)return; const inp=document.getElementById('iq-reply-input-'+cid); const txt=inp.value.trim(); if(!txt){alert('대댓글 내용을 입력해 주세요.');return;} const c=(i.comments||[]).find(x=>x.id===cid); if(!c)return; if(!c.replies)c.replies=[]; c.replies.push({author:'관리자',text:txt,time:iqNowStr()}); renderIqComments(i); }
function statusChip(s){ return s==='답변완료' ? '<span class="chip chip-green">답변완료</span>' : '<span class="chip chip-yellow">답변대기</span>';}function catChip(c){return `<span class="chip chip-blue" style="font-size:.65rem">${c}</span>`;}
function getFiltered(){ const cat=document.getElementById('iqCat').value; const q=document.getElementById('iqSearch').value.trim().toLowerCase(); return INQUIRIES.filter(i=>{ if(iqStatus!=='all'&&i.status!==iqStatus)return false; if(cat&&i.cat!==cat)return false; if(q&&!(i.title.toLowerCase().includes(q)||i.author.includes(q)))return false; return true; });}
function renderInquiries(){ const list=getFiltered(); document.getElementById('iqTbody').innerHTML=list.length ? list.map(i=>`<tr> <td style="font-weight:600">${i.id}</td> <td>${catChip(i.cat)}</td> <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500">${i.priv?'🔒 ':''}<a href="#" onclick="openIqDetail(${i.id});return false">${i.title}</a></td> <td>${i.author}</td> <td style="font-size:.78rem;color:var(--gray-500)">${i.date}</td> <td>${statusChip(i.status)}</td> <td><button class="btn btn-primary btn-xs" onclick="openIqDetail(${i.id})">상세·답변</button></td> </tr>`).join('') : `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray-400)">조회된 문의가 없습니다.</td></tr>`;
 const counts={}; INQUIRIES.forEach(i=>{counts[i.status]=(counts[i.status]||0)+1;}); document.querySelectorAll('.iqcnt').forEach(el=>{ const s=el.dataset.s; el.textContent=s==='all'?INQUIRIES.length:(counts[s]||0); });}
document.getElementById('iqFilters').querySelectorAll('.filter-chip').forEach(btn=>{ btn.addEventListener('click',function(){ document.querySelectorAll('#iqFilters .filter-chip').forEach(b=>b.classList.remove('on')); this.classList.add('on'); iqStatus=this.dataset.s; renderInquiries(); });});
function resetIqFilter(){ iqStatus='all'; document.querySelectorAll('#iqFilters .filter-chip').forEach(b=>b.classList.remove('on')); document.querySelector('#iqFilters .filter-chip[data-s="all"]').classList.add('on'); document.getElementById('iqCat').value=''; document.getElementById('iqSearch').value=''; renderInquiries();}
function openIqDetail(id){ currentIqId=id; const i=INQUIRIES.find(x=>x.id===id); if(!i)return; document.getElementById('iq-modal-title').textContent=`문의 상세 — ${i.title.slice(0,20)}`; document.getElementById('iq-cat').textContent=i.cat; document.getElementById('iq-author').textContent=i.author; document.getElementById('iq-contact').textContent=i.contact; document.getElementById('iq-date').textContent=i.date; document.getElementById('iq-priv').textContent=i.priv?'비공개':'공개'; document.getElementById('iq-content').textContent=i.content; document.getElementById('iq-reply').value=''; const prevArea=document.getElementById('iq-prev-reply-area'); if(i.reply){ prevArea.style.display='block'; document.getElementById('iq-prev-reply').textContent=i.reply; } else { prevArea.style.display='none'; } if(!i.comments)i.comments=[]; document.getElementById('iq-comment-input').value=''; renderIqStatus(i); renderIqComments(i); openModal('iqModal');}
function doIqReply(){ const i=INQUIRIES.find(x=>x.id===currentIqId); if(!i)return; const reply=document.getElementById('iq-reply').value.trim(); if(!reply){alert('답변 내용을 입력해 주세요.');return;} i.reply=reply; i.status='답변완료'; closeModal('iqModal'); renderInquiries(); alert('답변이 저장되었습니다.');}
function deleteInquiry(){ if(!confirm('이 문의를 삭제하시겠습니까?'))return; INQUIRIES=INQUIRIES.filter(i=>i.id!==currentIqId); closeModal('iqModal'); renderInquiries();}
function openModal(id){document.getElementById(id).classList.add('open');}function closeModal(id){document.getElementById(id).classList.remove('open');}document.querySelectorAll('.overlay').forEach(ov=>{ov.addEventListener('click',function(e){if(e.target===this)closeModal(this.id);});});function doLogout(){sessionStorage.clear();location.href='admin-login.html';}(function(){ const admin=JSON.parse(sessionStorage.getItem('bo_admin')||'{"name":"관리자","role":"최고관리자"}'); const ini=(admin.name||'관')[0]; ['sb-av','tb-av'].forEach(id=>document.getElementById(id).textContent=ini); document.getElementById('sb-name').textContent=admin.name;document.getElementById('sb-role').textContent=admin.role; document.getElementById('tb-name').textContent=admin.name;document.getElementById('tb-role').textContent=admin.role; const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('backdrop'); document.getElementById('hbBtn').addEventListener('click',()=>{const o=sidebar.classList.toggle('open');backdrop.classList.toggle('show',o);}); backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('show');}); document.getElementById('logoutBtn').addEventListener('click',()=>openModal('logoutModal')); renderInquiries();})();</script></body></html>
