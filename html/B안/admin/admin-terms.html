let editTermId=null;
function statusChip(s){const m={'게시중':'chip-green','게시예정':'chip-yellow','폐지':'chip-gray','작성중':'chip-blue'};return `<span class="chip ${m[s]||'chip-gray'}">${s}</span>`;}
function renderTerms(){const type=document.getElementById('termType').value;const stat=document.getElementById('termStatus').value;const list=TERMS.filter(t=>{if(type&&t.type!==type)return false;if(stat&&t.status!==stat)return false;return true;});const tbody=document.getElementById('termTbody');if(!list.length){tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:36px;color:var(--gray-400)">등록된 약관이 없습니다.</td></tr>`;return;}tbody.innerHTML=list.map(t=>`<tr><td>${t.id}</td><td>${t.type}</td><td style="font-weight:600">${t.version}</td><td>${t.published||'—'}</td><td>${t.revoked||'—'}</td><td>${statusChip(t.status)}</td><td>${t.consents.toLocaleString()}명</td><td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn btn-outline btn-xs" onclick="openPreview(${t.id})">미리보기</button>${t.status!=='게시중'?`<button class="btn btn-outline btn-xs" onclick="openTermModal(${t.id})">수정</button>`:''}${t.status==='작성중'||t.status==='게시예정'?`<button class="btn btn-success btn-xs" onclick="publishTerm(${t.id})">게시</button>`:''}${t.status==='게시중'?`<button class="btn btn-danger btn-xs" onclick="revokeTerm(${t.id})">폐지</button>`:''}</div></td></tr>`).join('');}
function openTermModal(id){editTermId=id;const t=id?TERMS.find(x=>x.id===id):null;document.getElementById('tm-title').textContent=t?'약관 수정':'약관 등록';document.getElementById('tm-type').value=t?t.type:'이용약관';document.getElementById('tm-version').value=t?t.version:'';document.getElementById('tm-publish').value=t&&t.published?t.published.replace(/\./g,'-'):'';document.getElementById('tm-body-ko').value=t?t.bodyKo:'';document.getElementById('tm-body-my').value='';document.getElementById('tm-body-en').value='';switchLang('ko');openModal('termModal');}
function switchLang(lang){document.querySelectorAll('.lang-tab').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));document.getElementById('tm-body-ko').closest('.form-group').style.display=lang==='ko'?'block':'none';document.getElementById('tm-body-my-wrap').style.display=lang==='my'?'block':'none';document.getElementById('tm-body-en-wrap').style.display=lang==='en'?'block':'none';}
function saveTerm(){const bodyKo=document.getElementById('tm-body-ko').value.trim();const version=document.getElementById('tm-version').value.trim();if(!version||!bodyKo){alert('버전과 한국어 본문은 필수입니다.');return;}const data={type:document.getElementById('tm-type').value,version,published:document.getElementById('tm-publish').value||'',status:'작성중',consents:0,bodyKo};if(editTermId){Object.assign(TERMS.find(x=>x.id===editTermId),data);alert('약관이 수정되었습니다.');}else{TERMS.unshift({id:Math.max(...TERMS.map(x=>x.id))+1,...data});alert('약관이 등록되었습니다.');}closeModal('termModal');renderTerms();}
function openPreview(id){const t=TERMS.find(x=>x.id===id);document.getElementById('pv-title').textContent=`${t.type} ${t.version} — 미리보기`;document.getElementById('pv-body').innerHTML=t.bodyKo.replace(/\n/g,'<br>');openModal('previewModal');}
function publishTerm(id){if(!confirm('약관을 게시하시겠습니까?'))return;const t=TERMS.find(x=>x.id===id);t.status='게시중';t.published=new Date().toISOString().slice(0,10).replace(/-/g,'.');renderTerms();alert('약관이 게시되었습니다.');}
function revokeTerm(id){if(!confirm('약관을 폐지하시겠습니까? 회원 노출이 중단됩니다.'))return;const t=TERMS.find(x=>x.id===id);t.status='폐지';t.revoked=new Date().toISOString().slice(0,10).replace(/-/g,'.');renderTerms();alert('약관이 폐지되었습니다.');}
function openConsentModal(){document.getElementById('consentSearch').value='';renderConsent();openModal('consentModal');}
function renderConsent(){const q=document.getElementById('consentSearch').value.trim().toLowerCase();const list=CONSENTS.filter(c=>!q||c.member.toLowerCase().includes(q));document.getElementById('consentTbody').innerHTML=list.length?list.map(c=>`<tr><td>${c.member}</td><td>${c.type}</td><td>${c.version}</td><td>${c.at}</td><td>${c.ip}</td><td>${c.method}</td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--gray-400)">동의 이력이 없습니다.</td></tr>`;}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function doLogout(){sessionStorage.clear();location.href='admin-login.html';}
document.querySelectorAll('.overlay').forEach(ov=>{ov.addEventListener('click',function(e){if(e.target===this)closeModal(this.id);});});
(function(){const admin=JSON.parse(sessionStorage.getItem('bo_admin')||'null');if(!admin){location.replace('admin-login.html');return;}const ini=(admin.name||'관')[0];['sb-av','tb-av'].forEach(id=>document.getElementById(id).textContent=ini);document.getElementById('sb-name').textContent=admin.name;document.getElementById('sb-role').textContent=admin.role;document.getElementById('tb-name').textContent=admin.name;document.getElementById('tb-role').textContent=admin.role;const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('backdrop');document.getElementById('hbBtn').addEventListener('click',()=>{const o=sidebar.classList.toggle('open');backdrop.classList.toggle('show',o);});backdrop.addEventListener('click',()=>{sidebar.classList.remove('open');backdrop.classList.remove('show');});document.getElementById('logoutBtn').addEventListener('click',()=>openModal('logoutModal'));renderTerms();})();
</script></body></html>
