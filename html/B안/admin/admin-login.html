<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>관리자 로그인 — TOPIK Myanmar BO</title><style>/* ===== RESET & BASE ===== */*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{ --primary:#1a4fa0; --primary-dark:#133d80; --primary-light:#e8f0fb; --accent:#c8a84b; --danger:#d9363e; --danger-light:#fdf0f0; --success:#1e7e4a; --success-light:#eaf6ef; --warning:#b45309; --warning-light:#fef9ec; --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155; --gray-800:#1e293b; --gray-900:#0f172a; --white:#ffffff; --radius-sm:4px; --radius:8px; --radius-lg:12px; --shadow-sm:0 1px 2px rgba(0,0,0,.06); --shadow:0 2px 8px rgba(0,0,0,.10); --shadow-lg:0 8px 24px rgba(0,0,0,.14); --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --sidebar-w:240px; --topbar-h:56px; --transition:all .18s ease;}html{font-size:15px;-webkit-text-size-adjust:100%}body{font-family:var(--font);color:var(--gray-800);background:var(--gray-50);line-height:1.6}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}input,select,textarea{font-family:inherit}img{display:block;max-width:100%}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* ===== LOGIN PAGE ===== */.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0d2f6e 0%,#1a4fa0 50%,#1a5dbf 100%);padding:24px}.login-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:48px 44px;width:100%;max-width:420px}.login-logo{text-align:center;margin-bottom:32px}.login-logo-badge{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;background:var(--primary);border-radius:var(--radius);margin-bottom:12px}.login-logo-badge svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2}.login-title{font-size:1.3rem;font-weight:700;color:var(--gray-900);line-height:1.3}.login-subtitle{font-size:.85rem;color:var(--gray-500);margin-top:4px}.form-group{margin-bottom:18px}.form-label{display:block;font-size:.82rem;font-weight:600;color:var(--gray-700);margin-bottom:6px}.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:.95rem;color:var(--gray-800);background:var(--white);transition:var(--transition);outline:none}.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,79,160,.12)}.form-control.is-error{border-color:var(--danger)}.pw-wrap{position:relative}.pw-wrap .form-control{padding-right:44px}.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--gray-400);padding:4px;background:none;border:none;cursor:pointer;display:flex}.pw-toggle:hover{color:var(--gray-600)}.form-error{display:none;font-size:.78rem;color:var(--danger);margin-top:5px}.form-error.show{display:block}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;transition:var(--transition);cursor:pointer;border:none;line-height:1.4}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}.btn-block{width:100%;padding:12px}.login-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--gray-100);text-align:center;font-size:.8rem;color:var(--gray-400)}.login-lock-notice{background:var(--danger-light);border:1px solid #f5c6c8;border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--danger);margin-bottom:16px;display:none}.login-lock-notice.show{display:block}</style></head><body><div class="login-wrap"> <div class="login-card"> <div class="login-logo"> <div class="login-logo-badge"> <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> </div> <div class="login-title">TOPIK Myanmar 관리자</div> <div class="login-subtitle">Back-Office 관리 시스템</div> </div>
 <div class="login-lock-notice" id="lockNotice"> 로그인 5회 연속 실패로 계정이 잠금 상태입니다. 관리자에게 문의하세요. </div>
 <form id="loginForm" novalidate> <div class="form-group"> <label class="form-label" for="adminId">관리자 아이디</label> <input class="form-control" id="adminId" type="text" placeholder="아이디 입력" autocomplete="username" required> <div class="form-error" id="idError">아이디를 입력해 주세요.</div> </div> <div class="form-group"> <label class="form-label" for="adminPw">비밀번호</label> <div class="pw-wrap"> <input class="form-control" id="adminPw" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required> <button type="button" class="pw-toggle" id="pwToggle" aria-label="비밀번호 표시/숨김"> <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> </button> </div> <div class="form-error" id="pwError">비밀번호를 입력해 주세요.</div> </div> <div class="form-error show" id="loginError" style="display:none;margin-bottom:12px;font-size:.85rem"></div> <button type="submit" class="btn btn-primary btn-block" id="loginBtn">로그인</button> </form>
 <div class="login-footer"> TOPIK Myanmar BO v1.0 &copy; 2025 주미얀마대사관 </div> </div></div>
<script>
(function(){
  const FAIL_KEY='bo_fail_cnt';
  const LOCK_KEY='bo_lock_until';
  const ADMINS=[
    {id:'superadmin',pw:'Admin1234!',role:'최고관리자',name:'관리자'},
    {id:'manager',pw:'Admin1234!',role:'일반관리자',name:'운영자'},
    {id:'viewer',pw:'Admin1234!',role:'조회관리자',name:'조회자'}
  ];
  const form=document.getElementById('loginForm');
  const idEl=document.getElementById('adminId');
  const pwEl=document.getElementById('adminPw');
  const lockNotice=document.getElementById('lockNotice');
  const pwToggle=document.getElementById('pwToggle');

  function checkLock(){
    const until=localStorage.getItem(LOCK_KEY);
    if(until&&Date.now()<+until){
      lockNotice.classList.add('show');
      return true;
    }
    lockNotice.classList.remove('show');
    return false;
  }

  function doDemoLogin(){
    localStorage.removeItem(FAIL_KEY);
    localStorage.removeItem(LOCK_KEY);
    lockNotice.classList.remove('show');
    const id=idEl.value.trim();
    const admin=ADMINS.find(function(a){ return a.id===id; })||ADMINS[0];
    sessionStorage.setItem('bo_admin',JSON.stringify({id:admin.id,name:admin.name,role:admin.role}));
    const next=new URLSearchParams(location.search).get('next');
    location.href=(next&&next.startsWith('admin'))?next:'admin-dashboard.html';
  }

  pwToggle.addEventListener('click',function(){
    pwEl.type=pwEl.type==='text'?'password':'text';
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    doDemoLogin();
  });

  checkLock();
  if(sessionStorage.getItem('bo_admin')){
    const next=new URLSearchParams(location.search).get('next');
    location.replace((next&&next.startsWith('admin'))?next:'admin-dashboard.html');
  }
})();
</script></body></html>
