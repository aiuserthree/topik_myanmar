<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOPIK Myanmar BO — 접수 관리</title>
  <link rel="stylesheet" href="assets/bo.css" />
</head>
<body>
  <div class="bo-app">
    <aside class="bo-sb" id="boSidebar">
      <div class="bo-sb-brand">
        <span class="mark">T</span>
        <span class="name">TOPIK Myanmar<small>ADMIN CONSOLE</small></span>
      </div>
      <nav class="bo-sb-nav">
        <div class="bo-sb-section">운영</div>
        <a href="applications.html" class="bo-sb-link is-active">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h4"/></svg>
          <span class="label">접수 관리</span>
        </a>
        <a href="rounds.html" class="bo-sb-link">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span class="label">회차 관리</span>
        </a>
        <a href="venues.html" class="bo-sb-link">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="label">시험장 관리</span>
        </a>
        <div class="bo-sb-section">콘텐츠</div>
        <a href="notices.html" class="bo-sb-link">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="label">공지 관리</span>
        </a>
        <a href="faq.html" class="bo-sb-link">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          <span class="label">FAQ 관리</span>
        </a>
        <a href="terms.html" class="bo-sb-link">
          <svg class="ico" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/></svg>
          <span class="label">약관 관리</span>
        </a>
      </nav>
      <div class="bo-sb-foot">
        <div class="bo-sb-user">
          <span class="avatar">A</span>
          <span class="meta"><span class="nm" id="adminId">관리자</span><span class="rl">백오피스 운영자</span></span>
        </div>
        <button class="bo-sb-logout" id="logoutBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          로그아웃
        </button>
      </div>
    </aside>

    <header class="bo-tb">
      <button class="bo-tb-ham" id="boHam" type="button" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <div class="bo-tb-crumb"><span>백오피스</span><span class="sep">›</span><span>운영</span></div>
        <div class="bo-tb-title">접수 관리</div>
      </div>
      <div class="bo-tb-spacer"></div>
      <div class="bo-tb-actions">
        <label class="bo-round-ctx">회차 <select id="roundSelect" class="bo-select"></select></label>
      </div>
    </header>

    <main class="bo-mn">
      <div class="bo-page-head">
        <div>
          <h1>접수 관리</h1>
        </div>
        <div class="bo-page-tools">
          <button class="bo-btn bo-btn-primary" id="assignBtn" type="button">수험번호 일괄 부여</button>
          <button class="bo-btn bo-btn-secondary" id="rosterBtn" type="button">연명부 엑셀</button>
          <button class="bo-btn bo-btn-secondary" id="zipBtn" type="button">사진 ZIP</button>
        </div>
      </div>

      <section class="bo-roundstats" id="roundStats" hidden></section>

      <section class="bo-toolbar">
        <div class="bo-chips" id="statusChips">
          <button class="bo-chip is-on" data-chip="all" type="button">전체</button>
          <button class="bo-chip" data-chip="submitted" type="button">접수완료</button>
          <button class="bo-chip" data-chip="photo_pending" type="button">사진심사 대기</button>
          <button class="bo-chip" data-chip="payment_pending" type="button">수납대기</button>
          <button class="bo-chip" data-chip="approved" type="button">승인완료</button>
          <button class="bo-chip" data-chip="exam_number_assigned" type="button">수험번호 부여</button>
          <button class="bo-chip" data-chip="refunded" type="button">환불자</button>
          <button class="bo-chip" data-chip="rejected" type="button">반려</button>
          <button class="bo-chip" data-chip="cancelled" type="button">취소</button>
        </div>
        <div class="bo-filters">
          <select id="venueFilter" class="bo-select"><option value="">시험장 전체</option></select>
          <select id="levelFilter" class="bo-select">
            <option value="">급수 전체</option>
            <option value="I">TOPIK Ⅰ</option>
            <option value="II">TOPIK Ⅱ</option>
          </select>
          <input id="searchInput" class="bo-input" type="search" placeholder="한글·영문성명 / 생년월일 / 수험번호" />
          <button class="bo-btn bo-btn-secondary" id="searchBtn" type="button">검색</button>
          <span class="bo-actions-spacer"></span>
          <span class="bo-result-count" id="resultCount"></span>
        </div>
      </section>

      <div class="bo-table-wrap">
        <table class="bo-table">
          <thead>
            <tr>
              <th>번호</th>
              <th>사진</th>
              <th>한글성명</th>
              <th>영문성명</th>
              <th>생년월일</th>
              <th>성별</th>
              <th>국적</th>
              <th>급수</th>
              <th>시험장</th>
              <th>접수일</th>
              <th>사진심사</th>
              <th>수납</th>
              <th>수험번호</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="appRows">
            <tr><td colspan="15" class="bo-empty">데이터를 불러오는 중…</td></tr>
          </tbody>
        </table>
      </div>

      <nav class="bo-pagination" id="pagination"></nav>
    </main>
  </div>

  <div class="bo-sb-backdrop" id="boSbBackdrop"></div>

  <!-- 상세 / 사진심사 / 수납 슬라이드 패널 -->
  <div class="bo-overlay" id="overlay" hidden></div>
  <aside class="bo-panel" id="detailPanel" hidden aria-hidden="true">
    <div class="bo-panel-head">
      <h2 id="panelTitle">접수 상세</h2>
      <button class="bo-btn bo-btn-ghost" id="panelClose" type="button">✕</button>
    </div>
    <div class="bo-panel-body" id="panelBody"></div>
  </aside>

  <div class="bo-toast" id="toast" hidden></div>

  <script src="../../shared/bo-api-client.js"></script>
  <script src="assets/bo-shell.js"></script>
  <script src="assets/bo-ops.js"></script>
</body>
</html>
