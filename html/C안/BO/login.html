<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOPIK Myanmar BO — 관리자 로그인</title>
  <link rel="stylesheet" href="assets/bo.css" />
</head>
<body class="bo-login-body">
  <main class="bo-login-card">
    <aside class="bo-login-aside">
      <div>
        <div class="bo-login-mark">
          <div class="bo-login-logo">T</div>
          <div class="bo-login-mname">TOPIK Myanmar<small>관리자 콘솔 · ADMIN CONSOLE</small></div>
        </div>
        <h2><small>BACKOFFICE</small>한국어능력시험<br />접수 운영 관리 시스템</h2>
        <p class="bo-login-desc">접수자 관리·사진 심사·회차 운영·콘텐츠 발행을 한 곳에서. 모든 처리 이력은 자동 기록됩니다.</p>
        <div class="bo-login-features">
          <div class="f">회차별 접수 관리 및 수험번호 일괄 부여</div>
          <div class="f">사진 심사 · 오프라인 수납 처리</div>
          <div class="f">공지 · FAQ · 약관 콘텐츠 발행</div>
        </div>
      </div>
      <div class="bo-login-foot">© 2026 주미얀마 대한민국 대사관 · NIIED</div>
    </aside>

    <section class="bo-login-main">
      <h1 class="bo-login-title">관리자 로그인</h1>
      <p class="bo-login-sub">발급받은 관리자 계정으로 로그인하세요.</p>

      <form id="loginForm" class="bo-login-form" autocomplete="off">
        <label class="bo-field">
          <span>이메일</span>
          <input type="email" id="email" name="email" placeholder="admin-dev@topik-mm.local" required />
        </label>
        <label class="bo-field">
          <span>비밀번호</span>
          <input type="password" id="password" name="password" placeholder="비밀번호" required />
        </label>
        <button type="submit" class="bo-btn bo-btn-primary bo-btn-block" id="loginBtn">로그인</button>
        <p class="bo-login-msg" id="loginMsg" role="alert"></p>
      </form>

      <p class="bo-login-hint">개발 환경 기본 계정: <code>admin-dev@topik-mm.local</code></p>
    </section>
  </main>

  <script src="../../shared/bo-api-client.js"></script>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var msg = document.getElementById("loginMsg");
      var btn = document.getElementById("loginBtn");

      if (window.TopikBoApi && TopikBoApi.getAccessToken && TopikBoApi.getAccessToken()) {
        // already logged in
        location.replace("applications.html");
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = "";
        msg.className = "bo-login-msg";
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        btn.disabled = true;
        btn.textContent = "로그인 중…";
        TopikBoApi.login(email, password).then(function (res) {
          if (res.ok) {
            location.replace("applications.html");
          } else {
            msg.textContent = TopikBoApi.parseError(res) || "로그인에 실패했습니다.";
            msg.className = "bo-login-msg is-error";
            btn.disabled = false;
            btn.textContent = "로그인";
          }
        });
      });
    })();
  </script>
</body>
</html>
