<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비밀번호 재설정 — TOPIK Myanmar</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: 24px 16px 48px; }
  .auth-head { text-align: center; margin-bottom: 24px; }
  .auth-head h1 { font-size: 22px; }
  .auth-head p { font-size: 14px; color: var(--text-3); margin-top: 6px; line-height: 1.55; }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    height: 28px; padding: 0 8px; color: var(--text-3); font-size: 12px;
  }
  .pw-strength { display: flex; gap: 4px; margin-top: 8px; }
  .pw-strength .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .pw-strength.weak .seg:nth-child(1) { background: var(--danger); }
  .pw-strength.mid .seg:nth-child(-n+2) { background: var(--warning); }
  .pw-strength.good .seg:nth-child(-n+3), .pw-strength.strong .seg { background: var(--success); }
  .pw-meta { font-size: 12px; color: var(--text-3); margin-top: 6px; }
  .state-panel { display: none; text-align: center; padding: 12px 0; }
  .state-panel.show { display: block; }
  .state-ico {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
  }
  .state-ico.ok { background: var(--success-50, #e8f5e9); color: var(--success); }
  .state-ico.err { background: var(--danger-50); color: var(--danger); }
  .state-panel h2 { font-size: 18px; margin-bottom: 8px; }
  .state-panel p { font-size: 13.5px; color: var(--text-3); line-height: 1.6; margin-bottom: 16px; }
  .demo-note {
    font-size: 12px; padding: 10px 12px; background: #fffbeb; border: 1px solid #fcd34d;
    border-radius: var(--radius-sm); margin-bottom: 16px; line-height: 1.5; color: var(--text-3);
  }
</style>
</head>
<body data-footer-compact>

<div id="site-header"></div>

<main class="page" role="main">
  <div class="auth-wrap">
    <div class="auth-head">
      <h1>비밀번호 재설정</h1>
      <p>이메일로 받은 링크를 통해 새 비밀번호를 설정합니다.<br>링크 유효시간: 30분</p>
    </div>

    <p class="demo-note demo-only hidden" id="demoNote"><strong>데모</strong> — <code>?token=demo</code> 또는 임의 토큰. 만료: <code>?token=expired</code></p>

    <div class="state-panel" id="panelInvalid">
      <div class="state-ico err">!</div>
      <h2>링크가 유효하지 않습니다</h2>
      <p>비밀번호 재설정 링크가 만료되었거나 이미 사용되었습니다.<br>로그인 화면에서 비밀번호 찾기를 다시 진행해 주세요.</p>
      <a href="login.html" class="btn btn-primary">로그인으로 돌아가기</a>
    </div>

    <div class="state-panel show" id="panelForm">
      <div class="form-row">
        <label class="label" for="newPw1">새 비밀번호 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="newPw1" placeholder="영문+숫자+특수문자 8자 이상" autocomplete="new-password">
          <button type="button" class="pw-toggle" id="toggle1">표시</button>
        </div>
        <div class="pw-strength" id="pwBar">
          <span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span>
        </div>
        <div class="pw-meta" id="pwMeta">8자 이상 / 영문·숫자·특수문자 조합 권장</div>
      </div>
      <div class="form-row">
        <label class="label" for="newPw2">새 비밀번호 확인 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="newPw2" placeholder="한 번 더 입력" autocomplete="new-password">
          <button type="button" class="pw-toggle" id="toggle2">표시</button>
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-block btn-lg" id="btnSave">비밀번호 저장</button>
    </div>

    <div class="state-panel" id="panelSuccess">
      <div class="state-ico ok">✓</div>
      <h2>비밀번호가 변경되었습니다</h2>
      <p>새 비밀번호로 로그인해 주세요.</p>
      <a href="login.html?reset=ok" class="btn btn-primary">로그인하러 가기</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<div id="site-tabbar"></div>

<script src="assets/common.js"></script>
<script>
(function () {
  function isValidPw(v) {
    if (v.length < 8) return false;
    if (!/[A-Za-z]/.test(v)) return false;
    if (!/\d/.test(v)) return false;
    if (!/[^A-Za-z0-9]/.test(v)) return false;
    return true;
  }
  var token = (new URLSearchParams(location.search).get('token') || '').trim();
  var invalid = !token || token === 'expired' || token === 'invalid';
  function show(id) {
    ['panelInvalid', 'panelForm', 'panelSuccess'].forEach(function (pid) {
      var el = document.getElementById(pid);
      if (el) el.classList.toggle('show', pid === id);
    });
  }
  if (invalid) { show('panelInvalid'); return; }
  if (new URLSearchParams(location.search).get('export') !== '1') {
    document.getElementById('demoNote').classList.remove('hidden');
  }
  show('panelForm');

  document.getElementById('newPw1').addEventListener('input', function () {
    var v = this.value, score = 0;
    if (v.length >= 8) score++;
    if (/[A-Za-z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    var bar = document.getElementById('pwBar');
    bar.className = 'pw-strength' + ['', ' weak', ' weak', ' mid', ' good', ' strong'][score];
    document.getElementById('pwMeta').textContent =
      ['', '약함', '약함', '보통', '강함', '매우 강함'][score] + ' · 영문+숫자+특수문자 8자 이상 권장';
  });
  function bindToggle(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', function () {
      var inp = document.getElementById(inputId);
      var isPw = inp.type === 'password';
      inp.type = isPw ? 'text' : 'password';
      this.textContent = isPw ? '숨김' : '표시';
    });
  }
  bindToggle('toggle1', 'newPw1');
  bindToggle('toggle2', 'newPw2');

  document.getElementById('btnSave').addEventListener('click', function () {
    var n1 = document.getElementById('newPw1').value;
    var n2 = document.getElementById('newPw2').value;
    if (!isValidPw(n1)) { alert('영문·숫자·특수문자를 각각 포함하여 8자 이상 입력해 주세요.'); return; }
    if (n1 !== n2) { alert('새 비밀번호가 서로 일치하지 않습니다.'); return; }
    show('panelSuccess');
  });
})();
</script>
</body>
</html>
