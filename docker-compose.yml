# Local PostgreSQL for TOPIK Myanmar API development
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: topik
      POSTGRES_PASSWORD: topik_dev
      POSTGRES_DB: topik_mm_dev
    ports:
      - "5432:5432"
    volumes:
      - topik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topik -d topik_mm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  topik_pgdata:
